apiVersion: apps/v1
kind: Deployment
metadata: {name: heart-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: heart-api}}
  template:
    metadata: {labels: {app: heart-api}}
    spec:
      containers:
        - name: api
          image: heart-disease-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: heart-api-service}
spec:
  selector: {app: heart-api}
  ports: [{port: 80, targetPort: 8000}]
  type: LoadBalancer
